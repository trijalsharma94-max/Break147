/* BREAK147 UI POLISH v2 — premium motion + controls */
:root{--ease:cubic-bezier(.22,1,.36,1);--ease2:cubic-bezier(.16,1,.3,1)}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(circle at 15% 15%,rgba(213,181,110,.08),transparent 28%),radial-gradient(circle at 90% 75%,rgba(181,139,67,.06),transparent 30%)}

.nav button.active{transform:translateX(3px)}
.topbar{box-shadow:0 8px 30px rgba(39,31,20,.05);transition:box-shadow .25s ease}

.tablecard{animation:cardIn .55s var(--ease) both}.tablecard:nth-child(2){animation-delay:.04s}.tablecard:nth-child(3){animation-delay:.08s}.tablecard:nth-child(4){animation-delay:.12s}.tablecard:nth-child(5){animation-delay:.16s}

.btn:hover{transform:translateY(-2px);box-shadow:0 7px 18px rgba(39,31,20,.10)}.btn:hover::before{transform:translateX(130%)}.btn:active{transform:translateY(0) scale(.97);box-shadow:none}

<script>
(function(){
  document.body.classList.add('break147-locked');
  const login=document.getElementById('break147Login');
  const form=document.getElementById('break147LoginForm');
  const user=document.getElementById('break147User');
  const pass=document.getElementById('break147Pass');
  const err=document.getElementById('break147LoginError');

  if(sessionStorage.getItem('break147_logged_in')==='1'){
    login.style.display='none';
    document.body.classList.remove('break147-locked');
  }

  async function loginPasswordHash(value){
    const data=new TextEncoder().encode(String(value));
    const digest=await crypto.subtle.digest('SHA-256',data);
    return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  form.addEventListener('submit',async function(e){
    e.preventDefault();
    let storedHash='';
    try{
      const raw=localStorage.getItem('break147_db_v1');
      const data=raw?JSON.parse(raw):null;
      storedHash=data?.settings?.adminPasswordHash||'';
    }catch(_e){}
    // Default login: aman / break147. Existing saved password remains respected.
    const enteredHash=await loginPasswordHash(pass.value);
    const validDefault=(user.value.trim().toLowerCase()==='aman' && pass.value==='break147');
    if(user.value.trim().toLowerCase()==='aman' && ((storedHash && enteredHash===storedHash)||validDefault)){
      sessionStorage.setItem('break147_logged_in','1');
      login.style.display='none';
      document.body.classList.remove('break147-locked');
      err.style.display='none';
    }else{
      err.style.display='block';
      pass.value='';
      pass.focus();
    }
  });
})();
</script>

function pendingCustomerBalances(){
 const map={};
 (db.sales||[]).forEach(s=>{
  const n=String(s.customer||'').trim();

 });

function pendingSalesForCustomer(name){
 const n=String(name||'').trim().toLowerCase();
 if(!n)return [];
 return (db.sales||[])
  .filter(s=>{
   if(String(s.customer||'').trim().toLowerCase()!==n)return false;
   // A bill already included in a later final/consolidated bill is historical,
   // not a separate outstanding bill. Its amount is now represented by the
   // later final bill, so NEVER carry it forward again.
   if(s.status==='carried'||s.includedInFinal)return false;
   // Real outstanding amount = invoice total - all payments.
   const due=Math.max(0,whole(s.total)-whole(s.cash)-whole(s.online));
   s.balance=due;
   return due>0;
  })
  .sort((a,b)=>Number(a.time||0)-Number(b.time||0));
}

 if(!s)return 'unpaid';

 const due=Math.max(0,whole(s.total)-whole(s.cash)-whole(s.online));
 // An older bill included in a later final bill takes the status of that
 // final bill. It is NOT automatically paid merely because it was consolidated.
 if(s.includedInFinal){
   const finalSale=(db.sales||[]).find(x=>x.id===s.includedInFinal);

function changeTableQty(tid,pid,delta){

 if(!t||!i)return;
 const p=db.products.find(x=>x.id===(i.sourceProductId||i.productId||i.id));

}

function addToWalkin(id,size,selectedPrice){
 const p=db.products.find(x=>x.id===id);

 const price=selectedPrice!=null?whole(selectedPrice):whole(p.price);
 const key=String(id)+'_'+String(size||'single').toLowerCase();
 const name=size?`${p.name} (${size})`:p.name;

 renderWalkin();toast(name+' added');

function showTableChoiceSuggestions(tableId,v){

 // Build the list from every customer that has ever generated/saved a bill.

 const arr=q?all.filter(n=>normalizeCustomerName(n).toLowerCase().includes(q)):all;

 if(!arr.length){
   box.innerHTML=q?'<div class="suggestions"><div style="padding:12px;color:var(--muted)">No saved customer found</div></div>':'';

 }

 box.innerHTML='<div class="suggestions" role="listbox">'+arr.map(n=>{

function confirmTablePayment(){

 if(currentBill.paymentMode==='due'){
   cash=0;online=0;
 }else{
   cash=whole(document.getElementById('cashPaid')?.value);
   online=whole(document.getElementById('onlinePaid')?.value);
 }
 const paid=whole(cash+online);
 if(currentBill.paymentMode==='paid' && paid!==total)return toast('Fully Paid must equal '+money(total));

 completeBill();
}

function applyCustomerPayment(name,amount,cash,online){
 let remaining=whole(amount),remainingCash=whole(cash),remainingOnline=whole(online);
 const rows=pendingSalesForCustomer(name);
 rows.forEach(s=>{
   if(remaining<=0)return;
   const pay=Math.min(whole(s.balance),remaining);
   if(!pay)return;
   const fromCash=Math.min(remainingCash,pay);
   const fromOnline=pay-fromCash;
   s.cash=whole(s.cash)+fromCash;
   s.online=whole(s.online)+fromOnline;
   s.balance=whole(s.balance)-pay;
   s.status=s.balance<=0?'paid':(s.cash+s.online>0?'partial':'unpaid');
   db.payments.push({saleId:s.id,time:Date.now(),cash:fromCash,online:fromOnline,total:pay,source:'Non-Paid'});
   remaining-=pay;remainingCash-=fromCash;remainingOnline-=fromOnline;
 });
 return {applied:whole(amount)-remaining,left:remaining};
}
function completeExistingPayment(){
 if(!currentBill||currentBill.type!=='Existing')return;
 const s=db.sales.find(x=>x.id===currentBill.saleId);if(!s)return;
 const outstanding=saleDue(s);
 const addCash=whole(document.getElementById('cashPaid')?.value),addOnline=whole(document.getElementById('onlinePaid')?.value),sum=addCash+addOnline;
 if(!sum)return toast('Enter a payment');
 if(sum>outstanding)return toast('Payment cannot exceed remaining balance');
 s.cash=whole(s.cash)+addCash;
 s.online=whole(s.online)+addOnline;
 s.balance=Math.max(0,whole(s.total)-s.cash-s.online);
 s.status=s.balance<=0?'paid':'partial';
 db.payments.push({saleId:s.id,time:Date.now(),cash:addCash,online:addOnline,total:sum,source:'Invoice'});
 save();closeModal();showInvoice(s);render();toast(s.balance?'Payment added':'Bill fully paid');
}
function completeBill(){
 if(!currentBill)return;
 let items=[],sub=0,t=null;
 if(currentBill.type==='Table'){
   t=db.tables.find(x=>x.id===currentBill.tableId);if(!t)return;
   items=t.items.map(x=>({...x}));sub=tableSub(t);
 }else{
   items=(currentBill.items||walkin).map(x=>({...x}));sub=itemTotal(items);
 }
 const rawCustomer=normalizeCustomerName(
   currentBill.type==='Table'
     ? (document.getElementById('tableChoiceCustomer')?.value || document.getElementById('tableCustomerName')?.value || t?.customer || '')
     : (document.getElementById('customerName')?.value || '')
 );
 if(!rawCustomer)return toast('Customer name is required to generate a bill');
 const customer=ensureCustomerFromBill(rawCustomer);
 if(t) t.customer=customer;
 if(!sub)return toast('Nothing to bill');
 const pendingRows=billPendingRows(customer);
 const pendingTotal=whole(pendingRows.reduce((sum,row)=>sum+whole(row.balance),0));
 const gst=gstAmount(sub);
 const newChargeTotal=whole(sub+gst);
 const total=whole(newChargeTotal+pendingTotal);
 const cash=currentBill.type==='Table' && currentBill.tablePaid!=null ? whole(currentBill.tableCash) : whole(document.getElementById('cashPaid')?.value);
 const online=currentBill.type==='Table' && currentBill.tablePaid!=null ? whole(currentBill.tableOnline) : whole(document.getElementById('onlinePaid')?.value);
 const paid=currentBill.type==='Table' && currentBill.tablePaid!=null ? whole(currentBill.tablePaid) : whole(cash+online);
 const paymentMode=currentBill.paymentMode||'manual';
 if(paid>total)return toast('Payment cannot exceed total');
 if(paymentMode==='paid' && paid!==total)return toast('Fully Paid requires the complete bill amount');
 if(paymentMode==='partial' && (paid<=0 || paid>=total))return toast('Partial Payment must be more than ₹0 and less than the total');
 if(paymentMode==='due' && paid!==0)return toast('Add to Dues must have ₹0 payment');
 const previousPendingDetails=pendingRows.map(s=>({
  invoice:s.id,
  table:s.table,
  date:s.time,
  sessionStart:s.sessionStart||null,
  duration:s.duration||'—',
  description:`Previous pending`,
  amount:whole(s.balance),
  tableCharge:whole(s.tableCharge||0),
  gst:whole(s.gst||0),
  items:(s.items||[]).map(i=>({name:i.name,qty:whole(i.qty),price:whole(i.price)}))
}));
 const sale={
   id:db.settings.prefix+'-'+String(db.seq++).padStart(5,'0'), time:Date.now(), type:currentBill.type,
   table:currentBill.type==='Table'?currentBill.tableId:'—', items,
   tableCharge:currentBill.type==='Table'?charge(t):0,
   duration:currentBill.type==='Table'?timer(t):'—', sessionStart:currentBill.type==='Table'?(t.sessionStart||t.start||null):null,
   sessionEnd:currentBill.type==='Table'?Date.now():null,
   subtotal:whole(sub+pendingTotal), currentSubtotal:sub, gst, total, previousPendingAmount:pendingTotal,
   previousPendingDetails, newChargeTotal, cash, online, balance:whole(total-paid),
   status:paid>=total?'paid':(paid>0?'partial':'unpaid'), customer, consolidated:pendingRows.length>0
 };
 db.sales.push(sale);
 if(currentBill.heldId) db.held=db.held.filter(h=>h.id!==currentBill.heldId);
 // Previous unpaid bills are carried into this final invoice with their original descriptions.
 pendingRows.forEach(old=>{old.includedInFinal=sale.id;old.includedInFinalAt=Date.now();});
 if(paid>0)db.payments.push({saleId:sale.id,time:Date.now(),cash,online,total:paid,source:'Invoice'});
 if(currentBill.type==='Walk-in'){
   sellStock(items); walkin=[]; walkinCustomer='';
 }else if(currentBill.type==='Table'){
   sellStock(items);
   if(currentBill.end){t.status='available';t.start=null;t.sessionStart=null;t.elapsed=0;t.items=[];t.customer='';}
 }
 save(); closeModal();
 showInvoice(sale); render(); toast(sale.balance?`Final bill saved with ${money(sale.balance)} remaining`:'Final bill generated');
}

function nonpaid(){

  // Display is intentionally grouped by customer so the page stays compact
  // even when the same customer has many outstanding bills.
  const rows=(db.sales||[])
    .filter(s=>!s.includedInFinal&&s.status!=='carried'&&saleDue(s)>0)
    .sort((a,b)=>a.time-b.time);

  const total=rows.reduce((a,s)=>a+saleDue(s),0);

  const customerKey=s=>String(s.customer||'Walk-in').trim().toLowerCase();
  const groupByCustomer=list=>{
    const map=new Map();
    list.forEach(s=>{
      const key=customerKey(s);
      if(!map.has(key))map.set(key,{name:String(s.customer||'Walk-in').trim()||'Walk-in',rows:[]});
      map.get(key).rows.push(s);
    });
    return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name));
  };

  const renderCompactDue=s=>{
    const due=saleDue(s);
    const itemCount=(s.items||[]).reduce((a,i)=>a+whole(i.qty),0);

    return `<details class="nonpaid-due-details">
      <summary>
        <span class="nonpaid-due-summary-main">
          <b>${esc(s.id)}</b>
          <span>${s.table&&s.table!=='—'?'Table '+esc(s.table):'Walk-in'}</span>
          <span>${esc(fmtDate(s.time))} • ${esc(fmtTime(s.time))}</span>
          ${itemCount?`<span>${itemCount} item${itemCount===1?'':'s'}</span>`:''}
        </span>
        <span class="nonpaid-due-summary-right">
          <b>${money(due)}</b>
          <span class="nonpaid-chevron">⌄</span>
        </span>
      </summary>
      <div class="nonpaid-due-expanded">
        <div class="nonpaid-due-meta">
          ${s.sessionStart?`<span>Started ${esc(fmtDate(s.sessionStart))} ${esc(fmtTime(s.sessionStart))}</span>`:''}
          ${s.duration&&s.duration!=='—'?`<span>Duration ${esc(s.duration)}</span>`:''}
          ${s.type?`<span>${esc(s.type)}</span>`:''}
        </div>
        <div class="nonpaid-items">
          <div class="nonpaid-items-head"><b>Original bill details</b><span>${itemCount} item${itemCount===1?'':'s'}</span></div>
          ${s.tableCharge?`<div class="nonpaid-item-line"><span><b>Snooker Table ${esc(s.table)}</b><small>${esc(s.duration||'Session')}</small></span><b>${money(s.tableCharge)}</b></div>`:''}
          ${(s.items||[]).length
            ? s.items.map(i=>`<div class="nonpaid-item-line"><span><b>${esc(i.name)}</b><small>${whole(i.qty)} × ${money(i.price)}</small></span><b>${money(i.price*i.qty)}</b></div>`).join('')
            : '<div class="nonpaid-empty-note">No food or beverage items.</div>'}

          <div class="nonpaid-item-total"><span>Paid so far</span><b>${money(whole(s.cash)+whole(s.online))}</b></div>

        <div class="actions" style="margin-top:10px">
          <button class="btn small" onclick='showInvoice(${JSON.stringify(s)})'>View Invoice</button>

        </div>
      </div>
    </details>`;
  };

  const renderCustomerGroup=(g)=>{
    const groupTotal=g.rows.reduce((a,s)=>a+saleDue(s),0);

          <b>${esc(g.name)}</b>

  const walkinSection=(walkinRows.length||heldWalkins.length)?`<div class="nonpaid-table-card">

}

function profit(){
 const sales=db.sales||[];
 const byCat={};
 sales.forEach(s=>(s.items||[]).forEach(i=>{
   const qty=whole(i.qty), revenue=Number(i.price||0)*qty, cost=Number(i.cost||0)*qty, pr=revenue-cost, cat=i.cat||'Other';
   if(!byCat[cat])byCat[cat]={revenue:0,cost:0,profit:0,units:0};
   byCat[cat].revenue+=revenue;byCat[cat].cost+=cost;byCat[cat].profit+=pr;byCat[cat].units+=qty;
 }));
 const totals=Object.values(byCat).reduce((a,v)=>({revenue:a.revenue+v.revenue,cost:a.cost+v.cost,profit:a.profit+v.profit,units:a.units+v.units}),{revenue:0,cost:0,profit:0,units:0});
 const tableRevenue=sales.reduce((a,s)=>a+Number(s.tableCharge||0),0);
 const margin=totals.revenue>0?(totals.profit/totals.revenue*100):0;
 const daily=[];
 for(let i=6;i>=0;i--){
   const startDay=dayStart()-i*86400000,endDay=startDay+86400000;let rev=0,cost=0;
   sales.filter(s=>s.time>=startDay&&s.time<endDay).forEach(s=>(s.items||[]).forEach(x=>{rev+=Number(x.price||0)*whole(x.qty);cost+=Number(x.cost||0)*whole(x.qty)}));
   daily.push({label:new Intl.DateTimeFormat('en-IN',{day:'2-digit',month:'short'}).format(new Date(startDay)),profit:rev-cost,revenue:rev});
 }
 const maxBar=Math.max(1,...daily.map(x=>Math.max(0,x.profit)));
 const top=Object.entries(byCat).map(([cat,v])=>({cat,...v})).sort((a,b)=>b.profit-a.profit);
 const productMap={};
 sales.forEach(s=>(s.items||[]).forEach(i=>{const k=i.sourceProductId||i.productId||i.id,p=db.products.find(x=>x.id===k),name=p?.name||i.name;if(!productMap[name])productMap[name]={name,units:0,revenue:0,cost:0};productMap[name].units+=whole(i.qty);productMap[name].revenue+=Number(i.price||0)*whole(i.qty);productMap[name].cost+=Number(i.cost||0)*whole(i.qty)}));
 const topProducts=Object.values(productMap).map(x=>({...x,profit:x.revenue-x.cost})).sort((a,b)=>b.profit-a.profit).slice(0,10);
 return `<div class="profit-head"><div><h2 style="margin:0">Profit & Performance</h2><p class="muted">Calculated from recorded product cost price versus actual selling price. Table charges are shown separately.</p></div><div class="actions" style="margin:0"><button class="btn" onclick="go('inventory')">Manage Cost Prices</button></div></div>
 <div class="profit-summary" style="margin-top:15px"><div class="card stat kpi-premium"><div class="label">PRODUCT SALES</div><div class="value">${money(totals.revenue)}</div><div class="sub">Selling value</div></div><div class="card stat kpi-premium"><div class="label">PRODUCT COST</div><div class="value">${money(totals.cost)}</div><div class="sub">Recorded cost</div></div><div class="card stat kpi-premium"><div class="label">GROSS PROFIT</div><div class="value profit-positive">${money(totals.profit)}</div><div class="sub">Revenue − cost</div></div><div class="card stat kpi-premium"><div class="label">PROFIT MARGIN</div><div class="value">${margin.toFixed(1)}%</div><div class="sub">On product sales</div></div></div>
 <div class="grid cols" style="margin-top:15px"><div class="card"><div class="sectionhead" style="margin-top:0"><h3>7-Day Profit</h3></div><div class="profit-chart">${daily.map(d=>`<div class="profit-bar-wrap"><div class="profit-bar" style="height:${Math.max(4,Math.round(Math.max(0,d.profit)/maxBar*165))}px" title="${esc(d.label)} • ${money(d.profit)}"></div><small>${esc(d.label)}</small></div>`).join('')}</div></div><div class="card"><h3 style="margin-top:0">Business Split</h3><div class="billrow"><span>Product revenue</span><b>${money(totals.revenue)}</b></div><div class="billrow"><span>Product cost</span><b>${money(totals.cost)}</b></div><div class="billrow"><span>Gross product profit</span><b class="profit-positive">${money(totals.profit)}</b></div><div class="billrow"><span>Table revenue</span><b>${money(tableRevenue)}</b></div><div class="billrow"><span>Total recorded revenue</span><b>${money(totals.revenue+tableRevenue)}</b></div><small class="profit-muted">Table revenue has no product cost assigned and is not included in gross product profit.</small></div></div>
 <div class="grid cols" style="margin-top:15px"><div class="card"><h3 style="margin-top:0">Profit by Category</h3>${top.length?top.map(x=>`<div class="profit-product-row"><b>${esc(x.cat)}</b><span>${x.units} units</span><span>${money(x.revenue)}</span><span>${money(x.cost)}</span><span class="profit-positive">${money(x.profit)}</span></div>`).join(''):'<div class="empty">No product sales yet. Profit will appear after the first completed bill.</div>'}</div><div class="card"><h3 style="margin-top:0">Most Profitable Products</h3>${topProducts.length?topProducts.map(x=>`<div class="profit-product-row"><b>${esc(x.name)}</b><span>${x.units} units</span><span>${money(x.revenue)}</span><span>${money(x.cost)}</span><span class="profit-positive">${money(x.profit)}</span></div>`).join(''):'<div class="empty">No product sales yet.</div>'}</div></div>`;
}

async function hashAdminPassword(value){
 const data=new TextEncoder().encode(String(value));
 const digest=await crypto.subtle.digest('SHA-256',data);
 return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function requireAdmin(){
 const p=prompt('Enter Admin Panel password');
 if(p===null)return false;
 return (await hashAdminPassword(p))===db.settings.adminPasswordHash;
}
async function changeLoginPassword(){
  const current=prompt('Enter your current login password');
  if(current===null)return;
  if((await hashAdminPassword(current))!==db.settings.adminPasswordHash){
    return toast('Current password is incorrect');
  }
  const next=prompt('Enter the new login password (minimum 6 characters)');
  if(next===null)return;
  if(String(next).length<6)return toast('New password must be at least 6 characters');
  const confirmPass=prompt('Confirm the new login password');
  if(confirmPass===null)return;
  if(next!==confirmPass)return toast('New passwords do not match');
  db.settings.adminPasswordHash=await hashAdminPassword(next);
  save();
  toast('Login password changed successfully');
}

.category-list{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px}.category-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 9px;border-radius:999px;background:#f2ede4;border:1px solid var(--line);font-size:12px}.category-chip small{color:var(--muted);font-size:9px}.category-remove{border:0;background:#fff;color:#b33b35;border-radius:50%;width:20px;height:20px;cursor:pointer;font-weight:800}
</style>
<div class="b147-size-backdrop" id="b147SizeBackdrop" aria-hidden="true">
  <div class="b147-size-modal" role="dialog" aria-modal="true" aria-labelledby="b147SizeTitle">
    <div class="b147-size-title" id="b147SizeTitle">Choose portion</div>
    <div class="b147-size-sub">Select the portion you want to add to the bill.</div>
    <div class="b147-size-options" id="b147SizeOptions"></div>
    <button class="b147-size-cancel" type="button" onclick="closeSizePicker()">Cancel</button>
  </div>
</div>
<script>
let b147SizeContext=null;
function openSizePicker(pid,mode,tid){
  const p=db.products.find(x=>x.id===pid);
  if(!p)return toast('Product not found');
  if(whole(p.stock)<=0)return toast('Out of stock');
  const hasHalf=p.half!=null; const hasFull=p.full!=null;
  if(!hasHalf && !hasFull){
    return mode==='table'?addTableItem(tid,pid,null,p.price):addToWalkin(pid,null,p.price);
  }
  b147SizeContext={pid,mode,tid};
  const title=document.getElementById('b147SizeTitle');
  const box=document.getElementById('b147SizeOptions');
  if(!title||!box)return toast('Portion selector is unavailable');
  title.textContent=p.name+' • Select Portion';
  box.innerHTML='';
  if(hasHalf)box.insertAdjacentHTML('beforeend',`<button class="b147-size-btn" type="button" onclick="chooseProductSize('Half')"><b>HALF PORTION</b><strong>${money(p.half)}</strong></button>`);
  if(hasFull)box.insertAdjacentHTML('beforeend',`<button class="b147-size-btn" type="button" onclick="chooseProductSize('Full')"><b>FULL PORTION</b><strong>${money(p.full)}</strong></button>`);
  const back=document.getElementById('b147SizeBackdrop');
  back.classList.add('show');back.setAttribute('aria-hidden','false');
}
function closeSizePicker(){
  const back=document.getElementById('b147SizeBackdrop');
  if(back){back.classList.remove('show');back.setAttribute('aria-hidden','true');}
  b147SizeContext=null;
}
function chooseProductSize(size){
  const c=b147SizeContext;if(!c)return;
  const p=db.products.find(x=>x.id===c.pid);if(!p)return closeSizePicker();
  const price=size==='Half'?p.half:p.full;
  if(price==null)return toast(size+' price is not available');
  if(c.mode==='table')addTableItem(c.tid,c.pid,size,price);
  else addToWalkin(c.pid,size,price);
  closeSizePicker();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSizePicker()});
document.addEventListener('click',e=>{if(e.target?.id==='b147SizeBackdrop')closeSizePicker()});
</script>

<script>
(function BREAK147_MENU_REPAIR(){
 try{
   const raw=localStorage.getItem('break147_pos_v5');
   if(!raw)return;
   const saved=JSON.parse(raw);
   if(!saved||!Array.isArray(saved.products))return;
   const valid=saved.products.some(p=>p&&p.name&&p.cat);
   const looksOld=saved.products.some(p=>String(p.name||'').match(/Cold Drink|Burger|Pizza|Cigarette/i));
   const malformed=saved.products.some(p=>!p.name||!p.cat||p.price==null);
   const needsMenu=saved.menuVersion!==5 || !valid || looksOld || malformed || saved.products.length<70;
   if(needsMenu){
     saved.products=DEFAULT_PRODUCTS.map((p,i)=>{
       const x={...p,id:'p'+(i+1)};
       if(x.half!=null && x.full==null){ x.half=null; x.full=null; }
       return x;
     });
     saved.menuVersion=5;
     saved.categories=[...new Set([...CATS,...(saved.categories||[])])];
     localStorage.setItem('break147_pos_v5',JSON.stringify(saved));
     // Keep the live in-memory database synchronized after repair.
     if(typeof db!=='undefined')db=saved;
   }
 }catch(e){console.warn('BREAK147 menu repair skipped',e)}
})();
</script>
